name: "Setup lde"
description: "Install lde package manager"
branding:
    color: blue
    icon: moon

inputs:
    version:
        description: "Version to install (e.g., '0.8.1', 'latest', or 'nightly')"
        required: false
        default: "latest"
    platform:
        description: "Override platform (e.g., 'Linux', 'Darwin', 'Android'). Defaults to auto-detected."
        required: false
        default: ""
    arch:
        description: "Override architecture (e.g., 'x86_64', 'aarch64'). Defaults to auto-detected."
        required: false
        default: ""
    libc:
        description: "Override libc variant for Linux builds (e.g., 'musl', 'glibc'). Defaults to auto-detected."
        required: false
        default: ""
    dir:
        description: "Directory to install lde into. Empty uses the platform default (~/.lde, or %USERPROFILE%\\.lde on Windows)."
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        - name: Resolve version
          id: resolve
          shell: bash
          run: |
              VERSION="${{ inputs.version }}"
              if [ "$VERSION" = "nightly" ]; then
                echo "tag=nightly" >> "$GITHUB_OUTPUT"
              elif [ "$VERSION" = "latest" ]; then
                TAG=$(curl -sfL "https://github.com/lde-org/lde/releases/latest" -o /dev/null -w '%{url_effective}' | sed 's|.*/||')
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              else
                echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
              fi

        - name: Determine asset name (Unix)
          if: runner.os != 'Windows'
          id: asset_unix
          shell: bash
          run: |
              OS="${{ inputs.platform }}"
              ARCH="${{ inputs.arch }}"
              LIBC="${{ inputs.libc }}"
              [ -z "$OS" ] && { [ "$(uname -o 2>/dev/null)" = "Android" ] && OS="Android" || OS="$(uname -s)"; }
              [ -z "$ARCH" ] && ARCH="$(uname -m)"
              if [ -n "$LIBC" ] && [ "$OS" != "Linux" ]; then
                echo "Error: inputs.libc ('$LIBC') is only supported for Linux (resolved platform: $OS)" >&2
                exit 1
              fi
              SUFFIX=""
              if [ "$OS" = "Linux" ]; then
                if [ -z "$LIBC" ]; then
                  # Auto-detect: musl if the musl loader is present, otherwise glibc
                  if compgen -G "/lib/ld-musl-*.so.1" >/dev/null 2>&1; then
                    LIBC=musl
                  else
                    LIBC=glibc
                  fi
                fi
                case "$LIBC" in
                  musl)  SUFFIX="-musl" ;;
                  glibc) SUFFIX="" ;;
                  *) echo "Error: unsupported libc '$LIBC' (expected 'glibc' or 'musl')" >&2; exit 1 ;;
                esac
              fi
              case "$OS-$ARCH" in
                Linux-x86_64)    BIN="lde-linux-x86-64$SUFFIX" ;;
                Linux-aarch64)   BIN="lde-linux-aarch64$SUFFIX" ;;
                Android-aarch64) BIN="lde-android-aarch64" ;;
                Darwin-x86_64)   BIN="lde-macos-x86-64" ;;
                Darwin-arm64)    BIN="lde-macos-aarch64" ;;
                FreeBSD-amd64|FreeBSD-x86_64)   BIN="lde-freebsd-x86-64" ;;
                FreeBSD-arm64|FreeBSD-aarch64)  BIN="lde-freebsd-aarch64" ;;
                *) echo "Unsupported platform: $OS $ARCH"; exit 1 ;;
              esac
              echo "asset=$BIN.zip" >> "$GITHUB_OUTPUT"
              echo "inner=$BIN" >> "$GITHUB_OUTPUT"
              if [ "$OS" = "Linux" ]; then
                echo "libc_key=-$LIBC" >> "$GITHUB_OUTPUT"
              fi

        - name: Determine asset name (Windows)
          if: runner.os == 'Windows'
          id: asset_windows
          shell: pwsh
          run: |
              $arch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") { "aarch64" } else { "x86-64" }
              echo "asset=lde-windows-$arch.zip" >> $env:GITHUB_OUTPUT
              echo "inner=lde-windows-$arch.exe" >> $env:GITHUB_OUTPUT

        - name: Compute install dir cache suffix
          id: dirkey
          shell: bash
          run: |
              DIR_KEY=""
              if [ -n "${{ inputs.dir }}" ]; then
                # Cache keys must be filesystem-safe (no ':' or '\' from Windows
                # paths); collapse the dir to alphanumerics. Empty default keeps
                # the key byte-identical to before, so existing caches still hit.
                DIR_KEY="$(printf '%s' "${{ inputs.dir }}" | tr -c 'A-Za-z0-9' '-')"
              fi
              echo "dir_key=$DIR_KEY" >> "$GITHUB_OUTPUT"

        - name: Cache lde
          id: cache
          uses: actions/cache@v5
          with:
              path: ${{ inputs.dir != '' && inputs.dir || '~/.lde' }}/lde${{ runner.os == 'Windows' && '.exe' || '' }}
              key: lde-${{ steps.resolve.outputs.tag }}-${{ runner.os }}-${{ runner.arch }}${{ steps.asset_unix.outputs.libc_key }}${{ inputs.platform != '' && format('-{0}', inputs.platform) || '' }}${{ inputs.arch != '' && format('-{0}', inputs.arch) || '' }}${{ steps.dirkey.outputs.dir_key }}

        - name: Install lde (Unix)
          if: runner.os != 'Windows'
          shell: bash
          env:
              LDE_DIR: ${{ inputs.dir }}
          run: |
              DIR="${LDE_DIR:-$HOME/.lde}"
              mkdir -p "$DIR"
              if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
                curl -fL "https://github.com/lde-org/lde/releases/download/${{ steps.resolve.outputs.tag }}/${{ steps.asset_unix.outputs.asset }}" \
                  -o "$DIR/lde.zip"
                if command -v unzip >/dev/null 2>&1; then
                  unzip -o -q "$DIR/lde.zip" -d "$DIR"
                elif command -v busybox >/dev/null 2>&1; then
                  busybox unzip -o -q "$DIR/lde.zip" -d "$DIR"
                elif command -v python3 >/dev/null 2>&1; then
                  python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$DIR/lde.zip" "$DIR"
                else
                  echo "Error: no unzip available (install unzip, busybox, or python3 and re-run)" >&2
                  exit 1
                fi
                mv "$DIR/${{ steps.asset_unix.outputs.inner }}" "$DIR/lde"
                rm -f "$DIR/lde.zip"
                chmod +x "$DIR/lde"
              fi
              [ -z "${{ inputs.platform }}" ] && "$DIR/lde" --setup
              echo "$DIR" >> "$GITHUB_PATH"

        - name: Install lde (Windows)
          if: runner.os == 'Windows'
          shell: pwsh
          env:
              LDE_DIR: ${{ inputs.dir }}
          run: |
              $dir = if ($env:LDE_DIR) { $env:LDE_DIR } else { Join-Path $env:USERPROFILE ".lde" }
              New-Item -ItemType Directory $dir -Force | Out-Null
              $zip = Join-Path $dir "lde.zip"
              if ("${{ steps.cache.outputs.cache-hit }}" -ne "true") {
                Invoke-WebRequest "https://github.com/lde-org/lde/releases/download/${{ steps.resolve.outputs.tag }}/${{ steps.asset_windows.outputs.asset }}" `
                  -OutFile $zip
                Expand-Archive -Path $zip -DestinationPath $dir -Force
                Move-Item -Path (Join-Path $dir "${{ steps.asset_windows.outputs.inner }}") -Destination (Join-Path $dir "lde.exe") -Force
                Remove-Item $zip -Force
              }
              & (Join-Path $dir "lde.exe") --setup
              echo $dir >> $env:GITHUB_PATH
